# Deploy the site to Vercel from GitHub Actions.
#
#   pull_request            -> preview deployment, URL commented on the PR
#   CI succeeded on a push  -> production deployment (master or main)
#   workflow_dispatch       -> manual production (re)deploy of the chosen branch
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       Account token: https://vercel.com/account/tokens
#   VERCEL_ORG_ID      "orgId" from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  "projectId" from .vercel/project.json after `vercel link`
#
# Rollout order: keep Vercel's own Git integration on until a preview deploy
# from this workflow has succeeded, then merge the vercel.json change that
# sets git.deploymentEnabled=false. See docs/pipelines/vercel-deployment.md.
name: Deploy (Vercel)

on:
  pull_request:
    branches: [master, main]
  # Production waits for the CI workflow to pass instead of racing it.
  # workflow_run only fires once this file exists on the default branch.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned CLI version; bump deliberately (Dependabot does not track this).
  VERCEL_CLI_VERSION: 61.0.0
  # The Vercel CLI reads these to target the project without `vercel link`.
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    name: Preview deployment
    # Secrets are not available to fork PRs or Dependabot PRs, so skip them.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # comment the preview URL on the PR
    concurrency:
      # A new push to the PR cancels the in-flight preview for the old commit.
      group: vercel-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Vercel project settings (preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # `vercel deploy` prints only the deployment URL on stdout.
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            // Update one sticky comment instead of adding a new one per push.
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\nPreview deployed: ${process.env.PREVIEW_URL}\n\nCommit: ${context.payload.pull_request.head.sha}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  production:
    name: Production deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # Never cancel a production deploy mid-flight; queued superseded runs
      # are replaced by the newest one.
      group: vercel-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Check out the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run: deploy exactly the commit CI tested, not the branch tip.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Vercel project settings (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
