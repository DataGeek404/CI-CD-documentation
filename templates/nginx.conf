# nginx server block for the Docusaurus static build (used by templates/Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /docs/foo -> /docs/foo/ redirects must be relative. An absolute redirect
    # uses nginx's own port (80) and breaks behind -p 8080:80 or a proxy.
    absolute_redirect off;

    # Docusaurus writes /docs/foo as /docs/foo/index.html; try the file, then
    # the directory, otherwise serve the site's own 404 page.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Webpack output under /assets has content hashes in file names, so it can
    # be cached for a year. HTML is not hashed and keeps the default headers.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compress text responses on the fly.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
