# Template: CI for a Node.js / TypeScript project.
# Copy to .github/workflows/ci.yml in your repository and adjust the scripts.
# Assumes package.json defines: lint, typecheck, test, build (missing ones are skipped).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default GITHUB_TOKEN permissions for every job: read-only.
# Grant more per job only when a step needs it (e.g. pull-requests: write).
permissions:
  contents: read

concurrency:
  # github.ref is refs/pull/<n>/merge for PRs, so each PR gets its own group.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let every run on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Fail fast instead of burning the 6-hour default.
    strategy:
      # Report every Node version's result instead of stopping at the first failure.
      fail-fast: false
      matrix:
        # Supported LTS lines; drop versions your package.json "engines" excludes.
        node: [20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't keep the token in .git/config; later steps don't need to push.
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # Caches the npm download cache (~/.npm), keyed on package-lock.json.
          # Use `yarn` or `pnpm` here if that is your package manager.
          cache: npm

      # `npm ci` installs exactly what package-lock.json says and fails if the
      # lockfile is out of sync with package.json; never use `npm install` in CI.
      - name: Install dependencies
        run: npm ci

      # --if-present: skip quietly when the script is not defined.
      - name: Lint
        run: npm run lint --if-present

      - name: Type-check
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      # Keep one build output for later jobs or manual download.
      - name: Upload build output
        if: matrix.node == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: dist/ # change to your build output directory
          if-no-files-found: warn
          retention-days: 7
